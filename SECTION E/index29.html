<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Card</title>

    <style>
        .scene {
            perspective: 600px;
        }

        .box {
            height: 200px;
            width: 200px;
            border: 1px solid black;
            background-color: red;
            margin: 50px auto;
            transform-style:preserve-3d
            transform all 
        }

        .box:hover {
            transform: rotateY(180deg);
        }
    </style>
</head>

<body>
    <div class="scene">
        <div class="box"></div>
        3D card
    </div>
</body>
</html>
